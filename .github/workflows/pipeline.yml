name: Daily Market Data Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 * * 1-5"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest market data
        run: |
          python download_data.py

      - name: Verify Week 1 dataset
        run: |
          test -f data/week1_initial_raw_dataset.csv
          ls -lh data/week1_initial_raw_dataset.csv

      - name: Run Week 2 preprocessing pipeline
        run: |
          python preprocessing.py

      - name: Verify Week 2 outputs
        run: |
          test -f output/week2_feature_dataset_pipeline.csv
          ls -lh output/week2_feature_dataset_pipeline.csv

          test -f output/week2_quality_report.csv
          test -f output/week2_correlation_matrix.csv
          test -f output/week2_target_correlations.csv
          test -f output/week2_feature_importance.csv

          ls -lh output/

      - name: Upload pipeline outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chooser-option-pipeline-outputs
          path: |
            data/week1_initial_raw_dataset.csv
            output/week2_feature_dataset_pipeline.csv
            output/week2_quality_report.csv
            output/week2_correlation_matrix.csv
            output/week2_target_correlations.csv
            output/week2_feature_importance.csv
            output/figures/*.png
          if-no-files-found: error

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/week1_initial_raw_dataset.csv
          git add output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update automated market data and Week 2 outputs"
            git push
          fi
