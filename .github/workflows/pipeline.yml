name: Daily Market Data Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest market data
        run: |
          python download_data.py

      - name: Verify Week 1 dataset
        run: |
          test -f data/week1_initial_raw_dataset.csv
          ls -lh data/week1_initial_raw_dataset.csv

      - name: Run Week 2 preprocessing notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute preprocessing.ipynb \
            --output preprocessing_executed.ipynb \
            --ExecutePreprocessor.timeout=600

      - name: Verify Week 2 dataset
        run: |
          test -f output/week2_feature_dataset_pipeline.csv
          ls -lh output/week2_feature_dataset_pipeline.csv

      - name: Upload datasets as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chooser-option-datasets
          path: |
            data/week1_initial_raw_dataset.csv
            output/week2_feature_dataset_pipeline.csv
            preprocessing_executed.ipynb

      - name: Commit updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/week1_initial_raw_dataset.csv
          git add output/week2_feature_dataset_pipeline.csv

          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "Update automated market datasets"
            git push
          fi
